# Fork-safe caller example. Final release preparation replaces the all-zero
# Action commit with the exact published Action-distribution commit.
name: n8n SecureFlow scan (example)

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Scan n8n workflows without write credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run n8n SecureFlow scan
        id: n8n-scan
        uses: jitwark/sfscanner/.github/actions/scan@827877bf7215c7119f33bd7967dcba0d531448e5
        with:
          path: examples
          fail-on: high
          sarif-file: n8n-scan.sarif
      - name: Retain advisory SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secureflow-sarif
          path: n8n-scan.sarif
          if-no-files-found: ignore
          retention-days: 7

  upload:
    name: Upload the report after the isolated scan
    needs: scan
    if: always() && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Read scan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secureflow-sarif
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: n8n-scan.sarif
