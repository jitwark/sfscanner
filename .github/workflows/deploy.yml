name: Deploy qualified release artifact to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Explicit release tag containing the locally qualified static artifact
        required: true
        type: string
      asset_name:
        description: Exact regular USTAR .tar asset name (no glob or URL)
        required: true
        type: string
      sha256:
        description: Exact lowercase SHA256 of the locally qualified archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  artifact:
    # Only trusted default-branch delivery code may consume the dispatch identity.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out delivery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; source CI pin
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; source CI pin
        with:
          node-version: 22.x
      - name: Download exact release asset and verify hash and archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ASSET: ${{ inputs.asset_name }}
          RELEASE_SHA256: ${{ inputs.sha256 }}
        run: >-
          node scripts/pages-release.mjs download
          --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG"
          --asset "$RELEASE_ASSET" --sha256 "$RELEASE_SHA256"
          --archive "$RUNNER_TEMP/qualified-pages.tar"
      - name: Verify again before confined extraction
        env:
          RELEASE_SHA256: ${{ inputs.sha256 }}
        run: >-
          node scripts/pages-release.mjs extract
          --archive "$RUNNER_TEMP/qualified-pages.tar" --sha256 "$RELEASE_SHA256"
          --destination "$RUNNER_TEMP/qualified-pages"
      - name: Create release-bound readback manifest
        env:
          RELEASE_SHA256: ${{ inputs.sha256 }}
        run: >-
          node scripts/pages-release.mjs manifest
          --source "$RUNNER_TEMP/qualified-pages"
          --output "$RUNNER_TEMP/pages-readback.json"
          --sha256 "$RELEASE_SHA256"
      - name: Prepare controlled Pages tar without path rewriting
        run: >-
          node scripts/pages-release.mjs create
          --source "$RUNNER_TEMP/qualified-pages"
          --archive "$RUNNER_TEMP/artifact.tar"
      - name: Upload controlled Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Upload expected-content readback manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-readback-manifest
          path: ${{ runner.temp }}/pages-readback.json
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: artifact
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out delivery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; source CI pin
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; source CI pin
        with:
          node-version: 22.x
      - name: Download expected-content readback manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pages-readback-manifest
          path: ${{ runner.temp }}/pages-readback-manifest
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5; existing Pages pin
      - name: Verify anonymous deployed content against qualified bytes
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA256: ${{ inputs.sha256 }}
        run: >-
          node scripts/pages-release.mjs readback
          --page-url "$PAGES_URL"
          --manifest "$RUNNER_TEMP/pages-readback-manifest/pages-readback.json"
          --sha256 "$RELEASE_SHA256"
